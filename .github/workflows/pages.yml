name: Publish Orbity Obshcheniya

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only a real main-branch publication may share the Pages queue.
  # PRs and manual feature-branch runs use branch/ref-scoped validation queues.
  group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'github-pages' || format('orbity-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check both languages and content alignment
        run: |
          node --check dist/app.js
          node --check dist/app.en.js
          node --check dist/course.js
          node --check dist/course.en.js
          node --check dist/progress-store.js
          node tests/locales.mjs
          node tests/ui-smoke.mjs
          node --test tests/progress-safety.mjs tests/ui-safety.mjs tests/workflow-safety.mjs
  react-acceptance:
    uses: ./.github/workflows/react-preview.yml
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate, react-acceptance]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Download only the build produced and browser-tested in this workflow run.
      # There is no checkout or rebuild between acceptance and publication.
      - name: Download accepted React website
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orbity-react-site-${{ github.sha }}
          path: accepted-site
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: accepted-site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
