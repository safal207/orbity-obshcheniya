name: Publish Orbity Obshcheniya

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR validation must never replace a pending main-branch publication.
  group: ${{ github.event_name == 'pull_request' && format('orbity-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check both languages and content alignment
        run: |
          node --check dist/app.js
          node --check dist/app.en.js
          node --check dist/course.js
          node --check dist/course.en.js
          node --check dist/progress-store.js
          node tests/locales.mjs
          node tests/ui-smoke.mjs
          node --test tests/progress-safety.mjs tests/ui-safety.mjs tests/workflow-safety.mjs
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
