name: React preview acceptance
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [feat/react-orbit-path]
permissions:
  contents: read
concurrency:
  # A standalone review run cannot cancel acceptance inside Pages publication.
  group: react-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Render social preview assets
        run: node scripts/render-social-assets.mjs
      - name: Unit tests and production bundle
        run: |
          npm test
          npm run build
          node scripts/verify-build.mjs
      - name: Real-browser acceptance (Chromium)
        run: npm run test:browser
      - name: Guided-resume acceptance (Firefox)
        env:
          PW_BROWSER: firefox
          PW_OUTPUT_DIR: test-results-firefox
          PW_HTML_DIR: playwright-report-firefox
        run: npx playwright test tests/guided-restart.browser.spec.mjs tests/answer-next-step.browser.spec.mjs tests/personal-path.browser.spec.mjs
      - name: Export accepted React website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orbity-react-site-${{ github.sha }}
          path: react-preview/build/
          if-no-files-found: error
          retention-days: 7
      - name: Archive exact tested source
        if: always()
        run: git -C .. archive --format=tar.gz --output=react-preview/source-tested.tar.gz HEAD
      - name: Export isolated preview and verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orbity-react-preview-${{ github.sha }}
          retention-days: 7
          path: |
            react-preview/build/
            react-preview/source-tested.tar.gz
            react-preview/package-lock.json
            react-preview/test-results/
            react-preview/playwright-report/
            react-preview/test-results-firefox/
            react-preview/playwright-report-firefox/
# This workflow can only validate and export artifacts. Pages owns publication.
